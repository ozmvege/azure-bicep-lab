name: Docs

# Publishes the lab to GitHub Pages. This is the one workflow that is safe to run on every
# push: it builds Markdown into HTML, touches no cloud subscription and costs nothing.
#
# The build is two steps, and the first one is the interesting one. docs-site/build.py
# copies the Markdown into site-src/ and rewrites the links that cannot work on a published
# site — the ones pointing at infra/ and scripts/ — into GitHub blob URLs. The Markdown in
# docs/ is never modified, so it keeps working in the repository and in an editor.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - 'README.md'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never two Pages deployments at once; never cancel one halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs-site/requirements.txt

      - name: Install MkDocs
        run: pip install -r docs-site/requirements.txt

      - name: Assemble site sources
        run: python docs-site/build.py

      - name: Build
        # --strict turns a broken internal link into a failed build. With 58 cross-chapter
        # links, that check is the reason this step exists at all.
        run: mkdocs build --strict

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
