# Documentation site for the zero-trust web platform lab.
#
# The Markdown in docs/ is the source of truth and is written to work on GitHub: every link
# to a template resolves relative to the repository. Those links cannot work on a published
# site, where infra/ is not served at all. Rather than degrade the repository to suit the
# site, docs-site/build.py assembles a copy into site-src/ and rewrites source links to
# GitHub blob URLs on the way. Nothing under docs/ is ever modified.

site_name: Zero-Trust Web Platform on Azure
site_description: A Bicep lab — one public entry point, everything else on Private Link, and a command that tries to break every claim.
site_author: Özen Ucan
site_url: https://ozmvege.github.io/azure-bicep-lab/

repo_url: https://github.com/ozmvege/azure-bicep-lab
repo_name: ozmvege/azure-bicep-lab
edit_uri: edit/main/docs/

# Generated by docs-site/build.py — never edit site-src/ by hand.
docs_dir: site-src
site_dir: site

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.view
  palette:
    # Dark olive ground with the lime accent as a foreground — the palette rule from the
    # portfolio: lime is a foreground on dark grounds and a background on light ones.
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark

extra_css:
  - assets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Overview: index.md
  - Build it:
      - 00 · Architecture: 00-architecture.md
      - 01 · Toolchain and bootstrap: 01-toolchain.md
      - 02 · Network: 02-network.md
      - 03 · Platform services: 03-platform-services.md
      - 04 · Compute: 04-compute.md
      - 05 · Edge and WAF: 05-edge-waf.md
      - 06 · Observability: 06-observability.md
      - 07 · Governance: 07-governance.md
  - Operate it:
      - 08 · Deployment stacks: 08-deployment-stacks.md
      - 09 · CI/CD with OIDC: 09-cicd-oidc.md
      - 10 · Verification: 10-verification.md
  - Engineer it:
      - 11 · Testing Bicep: 11-testing.md
      - 12 · Azure Verified Modules: 12-avm.md
  - Reference:
      - Troubleshooting: troubleshooting.md
      - Cost and cleanup: cost-and-cleanup.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ozmvege
      name: GitHub
    - icon: fontawesome/solid/globe
      link: https://oezen-ucan.dev
      name: oezen-ucan.dev
  generator: false

copyright: MIT licensed — Özen Ucan
